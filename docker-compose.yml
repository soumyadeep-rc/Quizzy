services:
  # 1. The Redis Database Container (Message Broker & State)
  redis-cache:
    image: redis:alpine
    container_name: quiz_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # 2. The Node.js Backend Container (Scaled Workers)
  backend:
    build: 
      context: ./backend
    # DELETED container_name so Docker can auto-name the clones (backend-1, backend-2, etc.)
    expose:
      - "5000" # CHANGED from 'ports' to 'expose' to prevent host collisions
    environment:
      - REDIS_URL=redis://redis-cache:6379
      - PORT=5000
    depends_on:
      - redis-cache
    deploy:
      replicas: 3 # THE SCALING MAGIC: Spins up 3 identical instances
    volumes:
      - ./backend:/app
      - /app/node_modules # The anonymous volume shield!

  # 3. The Nginx Reverse Proxy (Load Balancer)
  nginx:
    image: nginx:latest
    ports:
      - "8080:80" # You will access the app locally via http://localhost:8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  redis_data: