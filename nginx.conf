events {
    worker_connections 1024;
}

http {
    # Define the pool of Node.js servers
    upstream quizzy_backend {
        # ip_hash ensures a user's WebSocket handshake stays on the same server
        ip_hash; 
        
        # We will name the service 'backend' in Docker Compose
        server backend:5000; 
    }

    server {
        listen 80;

        location / {
            proxy_pass http://quizzy_backend;
            proxy_http_version 1.1;
            
            # Crucial: These headers prevent WebSockets from downgrading to HTTP
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}